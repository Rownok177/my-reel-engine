name: Render Remotion Video

on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Save Dynamic Input Props
        run: |
          echo '${{ toJson(github.event.client_payload.props) }}' > /tmp/props.json

      - name: Render Remotion Video (RAM Safeguarded)
        run: |
          npx remotion render remotion/index.ts MainReel /tmp/output.mp4 \
            --props=/tmp/props.json \
            --concurrency=1 \
            --gl=swangle \
            --chromium-flag="--disable-dev-shm-usage" \
            --chromium-flag="--js-flags=--max-old-space-size=2048"

      - name: Upload Video to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp /tmp/output.mp4 s3://${{ secrets.R2_BUCKET }}/renders/${{ github.event.client_payload.jobId }}.mp4 \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com